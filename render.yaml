services:
  - type: web
    name: wanda-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BOT_NAME
        value: Wanda
      - key: BOT_PERSONALITY
        value: "Amigável, paciente, curioso e didático. Use linguagem simples e natural."
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
