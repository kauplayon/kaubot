name: Cosmo tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: python -m compileall -q app.py cosmo_storage.py cosmo_tools.py tests
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("templates/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/cosmo-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/cosmo-inline.js
      - name: Run tests
        env:
          SECRET_KEY: test-only-secret-key-change-this
        run: pytest -q
